# Builds and tests the app on every push. On main it also publishes the APK as the
# "latest" pre-release, so it can be downloaded straight to a phone from the Releases page.
name: Android build

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zonmoment-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish "latest" pre-release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zonmoment-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest zonmoment-debug.apk --prerelease \
            --title "Zonmoment (latest build)" \
            --notes "Debug build of ${GITHUB_SHA::7}. For testing only."
