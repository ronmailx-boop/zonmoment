# Builds the signed App Bundle (AAB) for Google Play. Run it by hand: Actions -> "Release build" -> Run workflow.
#
# Repository secrets (the upload key, created once in Termux):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_KEYSTORE_PASSWORD
# The very first AAB of a new app must be uploaded by hand in Play Console (Google's rule).
name: Release build

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set - add the upload key secrets first (see README)."
            exit 1
          fi
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$SIGNING_KEYSTORE_PATH"
          if ! keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -alias "$SIGNING_KEY_ALIAS" \
                 -storepass "$SIGNING_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::keytool could not open the key - check ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          ./gradlew testDebugUnitTest bundleRelease
          rm -f "$SIGNING_KEYSTORE_PATH"
          cp app/build/outputs/bundle/release/app-release.aab "zonmoment-$VERSION_CODE.aab"
          echo "Built zonmoment-$VERSION_CODE.aab (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: zonmoment-aab-${{ github.run_number }}
          path: zonmoment-*.aab
          retention-days: 30

